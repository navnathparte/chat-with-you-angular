<div class="min-h-screen bg-[#111B21] flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <!-- Logo / Header -->
    <div class="text-center mb-8">
      <div
        class="w-20 h-20 bg-[#00A884] rounded-full flex items-center justify-center mx-auto mb-4"
      >
        <img src="logo.png" alt="chat-with-you logo" class="w-24 h-24 mx-auto" />
      </div>
      <h1 class="text-2xl font-bold text-white">Welcome back</h1>
      <p class="text-[#8696A0] mt-1 text-sm">Sign in to continue chatting</p>
    </div>

    <!-- Card -->
    <div class="bg-[#202C33] rounded-2xl p-8 shadow-2xl">
      @if (error()) {
        <div
          class="bg-red-500/10 border border-red-500/30 text-red-400 text-sm rounded-lg px-4 py-3 mb-5"
        >
          {{ error() }}
        </div>
      }

      <!-- Email -->
      <div class="mb-4">
        <label class="block text-[#8696A0] text-xs font-medium mb-2 uppercase tracking-wide"
          >Email</label
        >
        <input
          [(ngModel)]="email"
          type="email"
          placeholder="you@example.com"
          (keydown)="onKeydown($event)"
          class="w-full bg-[#2A3942] text-white placeholder-[#8696A0] border border-[#2A3942] focus:border-[#00A884] rounded-xl px-4 py-3 text-sm outline-none transition-colors"
        />
      </div>

      <!-- Password -->
      <div class="mb-6">
        <label class="block text-[#8696A0] text-xs font-medium mb-2 uppercase tracking-wide"
          >Password</label
        >
        <div class="relative">
          <input
            [(ngModel)]="password"
            [type]="showPassword() ? 'text' : 'password'"
            placeholder="••••••••"
            (keydown)="onKeydown($event)"
            class="w-full bg-[#2A3942] text-white placeholder-[#8696A0] border border-[#2A3942] focus:border-[#00A884] rounded-xl px-4 py-3 pr-12 text-sm outline-none transition-colors"
          />
          <button
            type="button"
            (click)="showPassword.set(!showPassword())"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-[#8696A0] hover:text-white transition-colors"
          >
            @if (showPassword()) {
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 4.411m0 0L21 21"
                />
              </svg>
            } @else {
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                />
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                />
              </svg>
            }
          </button>
        </div>
      </div>

      <!-- Login Button -->
      <button
        (click)="login()"
        [disabled]="loading()"
        class="w-full bg-[#00A884] hover:bg-[#00967A] disabled:opacity-60 disabled:cursor-not-allowed text-white font-semibold py-3 rounded-xl transition-colors flex items-center justify-center gap-2"
      >
        @if (loading()) {
          <svg class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle
              class="opacity-25"
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="4"
            />
            <path
              class="opacity-75"
              fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"
            />
          </svg>
          Signing in...
        } @else {
          Sign In
        }
      </button>

      <!-- Register link -->
      <p class="text-center text-[#8696A0] text-sm mt-6">
        Don't have an account?
        <a routerLink="/register" class="text-[#00A884] hover:underline font-medium">Create one</a>
      </p>
    </div>
  </div>
</div>
