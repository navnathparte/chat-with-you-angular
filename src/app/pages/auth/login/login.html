<div class="min-h-screen bg-[#111B21] flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <!-- Logo / Header -->
    <div class="text-center mb-8">
      <div
        class="w-20 h-20 bg-[#00A884] rounded-full flex items-center justify-center mx-auto mb-4"
      >
        <svg class="w-12 h-12 text-white" fill="currentColor" viewBox="0 0 24 24">
          <path
            d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"
          />
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-white">Welcome back</h1>
      <p class="text-[#8696A0] mt-1 text-sm">Sign in to continue chatting</p>
    </div>

    <!-- Card -->
    <div class="bg-[#202C33] rounded-2xl p-8 shadow-2xl">
      @if (error()) {
        <div
          class="bg-red-500/10 border border-red-500/30 text-red-400 text-sm rounded-lg px-4 py-3 mb-5"
        >
          {{ error() }}
        </div>
      }

      <!-- Email -->
      <div class="mb-4">
        <label class="block text-[#8696A0] text-xs font-medium mb-2 uppercase tracking-wide"
          >Email</label
        >
        <input
          [(ngModel)]="email"
          type="email"
          placeholder="you@example.com"
          (keydown)="onKeydown($event)"
          class="w-full bg-[#2A3942] text-white placeholder-[#8696A0] border border-[#2A3942] focus:border-[#00A884] rounded-xl px-4 py-3 text-sm outline-none transition-colors"
        />
      </div>

      <!-- Password -->
      <div class="mb-6">
        <label class="block text-[#8696A0] text-xs font-medium mb-2 uppercase tracking-wide"
          >Password</label
        >
        <div class="relative">
          <input
            [(ngModel)]="password"
            [type]="showPassword() ? 'text' : 'password'"
            placeholder="••••••••"
            (keydown)="onKeydown($event)"
            class="w-full bg-[#2A3942] text-white placeholder-[#8696A0] border border-[#2A3942] focus:border-[#00A884] rounded-xl px-4 py-3 pr-12 text-sm outline-none transition-colors"
          />
          <button
            type="button"
            (click)="showPassword.set(!showPassword())"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-[#8696A0] hover:text-white transition-colors"
          >
            @if (showPassword()) {
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 4.411m0 0L21 21"
                />
              </svg>
            } @else {
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                />
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                />
              </svg>
            }
          </button>
        </div>
      </div>

      <!-- Login Button -->
      <button
        (click)="login()"
        [disabled]="loading()"
        class="w-full bg-[#00A884] hover:bg-[#00967A] disabled:opacity-60 disabled:cursor-not-allowed text-white font-semibold py-3 rounded-xl transition-colors flex items-center justify-center gap-2"
      >
        @if (loading()) {
          <svg class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle
              class="opacity-25"
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="4"
            />
            <path
              class="opacity-75"
              fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"
            />
          </svg>
          Signing in...
        } @else {
          Sign In
        }
      </button>

      <!-- Register link -->
      <p class="text-center text-[#8696A0] text-sm mt-6">
        Don't have an account?
        <a routerLink="/register" class="text-[#00A884] hover:underline font-medium">Create one</a>
      </p>
    </div>
  </div>
</div>
